services:
  - type: web
    name: hybrid-ai-sysid-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: DEV_MODE
        value: "true"
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: OTP_PEPPER
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
